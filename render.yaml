services:
  - type: web
    name: linux-admin-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_SERVICES
        value: ""
      - key: API_DOCS_ENABLED
        value: "false"
      - key: COLLECTOR_ENABLED
        value: "true"
      - key: COLLECTOR_INTERVAL_SECONDS
        value: "300"
      - key: RETENTION_DAYS
        value: "7"
